[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "easydown-api-client"
version = "0.1.0"
description = "Server-side Python client for EasyDown public-media parsing API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
license-files = ["LICENSE"]
authors = [{name = "Zhang Bo", email = "contactus@easydown.org"}]
dependencies = []
keywords = ["easydown", "api", "media", "tiktok"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Documentation = "https://easydown.org/docs/en/api"
Source = "https://github.com/Mr-ZhangBo/easydown-python-client"
Issues = "https://github.com/Mr-ZhangBo/easydown-python-client/issues"

[tool.hatch.build.targets.wheel]
only-include = ["easydown_api_client.py"]

[tool.hatch.build.targets.sdist]
include = ["easydown_api_client.py", "test_client.py", "pyproject.toml", "README.md", "LICENSE"]
