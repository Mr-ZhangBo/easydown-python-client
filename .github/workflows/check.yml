name: Check Python API client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v test_client
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python verify_dist.py
      - name: Test installed wheel away from source directory
        run: |
          python -m pip install --no-deps dist/*.whl
          cp test_client.py "$RUNNER_TEMP/test_client.py"
          cd "$RUNNER_TEMP"
          python -m unittest -v test_client
      - uses: actions/upload-artifact@v7
        with:
          name: easydown-python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
